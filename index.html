<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f4f1ea" />
    <meta
      name="description"
      content="日新 —— 本地优先的生活记录与复盘笔记本。苟日新，日日新，又日新。"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="日新" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem('rixin.theme.v1') ||
            localStorage.getItem('mochi.theme.v1') ||
            localStorage.getItem('inkstone.theme.v1');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.dataset.theme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#111316');
          }
        } catch (error) {
          /* private mode / blocked storage: keep the light default */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="apple-touch-startup-image" href="./splash/iphone-15-pro-max.png" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
